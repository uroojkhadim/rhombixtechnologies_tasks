<div class="flex min-h-screen bg-slate-100 dark:bg-surface-950">
  <!-- Sidebar -->
  <aside class="fixed inset-y-0 left-0 z-50 flex w-64 flex-col border-r border-slate-200/80 bg-white dark:border-slate-800 dark:bg-surface-900 lg:static">
    <div class="flex h-16 items-center gap-2.5 border-b border-slate-200/80 px-5 dark:border-slate-800">
      <span class="flex h-8 w-8 items-center justify-center rounded-lg bg-gradient-to-br from-brand-600 to-violet-600 text-xs font-bold text-white">IF</span>
      <div>
        <a routerLink="/" class="font-display text-sm font-bold text-slate-900 dark:text-white">InkFlow</a>
        <p class="text-[10px] font-medium uppercase tracking-wider text-slate-400">Admin</p>
      </div>
    </div>

    <nav class="flex-1 space-y-1 overflow-y-auto p-3">
      @for (item of navItems; track item.path) {
        <a
          [routerLink]="item.path"
          routerLinkActive="bg-brand-50 text-brand-700 dark:bg-brand-500/10 dark:text-brand-300"
          [routerLinkActiveOptions]="{ exact: item.exact ?? false }"
          class="flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm font-medium text-slate-600 transition hover:bg-slate-100 hover:text-slate-900 dark:text-slate-400 dark:hover:bg-slate-800 dark:hover:text-white"
        >
          <span class="text-lg">{{ item.icon }}</span>
          {{ item.label }}
        </a>
      }
    </nav>

    <div class="border-t border-slate-200/80 p-3 dark:border-slate-800">
      <button type="button" (click)="theme.toggle()" class="flex w-full items-center gap-3 rounded-xl px-3 py-2.5 text-sm font-medium text-slate-600 transition hover:bg-slate-100 dark:text-slate-400 dark:hover:bg-slate-800">
        {{ theme.darkMode() ? '☀️ Light mode' : '🌙 Dark mode' }}
      </button>
      <a routerLink="/" class="mt-1 flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm font-medium text-slate-600 transition hover:bg-slate-100 dark:text-slate-400 dark:hover:bg-slate-800">← View site</a>
      <button type="button" (click)="auth.logout()" class="mt-1 flex w-full items-center gap-3 rounded-xl px-3 py-2.5 text-sm font-medium text-red-600 transition hover:bg-red-50 dark:text-red-400 dark:hover:bg-red-950/30">Sign out</button>
    </div>
  </aside>

  <!-- Main -->
  <div class="flex min-w-0 flex-1 flex-col lg:ml-0">
    <header class="sticky top-0 z-40 flex h-16 items-center justify-between border-b border-slate-200/80 bg-white/90 px-6 backdrop-blur-xl dark:border-slate-800 dark:bg-surface-900/90">
      <div>
        <p class="text-xs font-medium text-slate-400">Dashboard</p>
        <h1 class="text-sm font-semibold text-slate-900 dark:text-white">{{ pageTitle() }}</h1>
      </div>
      <div class="flex items-center gap-3">
        <button type="button" class="relative flex h-9 w-9 items-center justify-center rounded-xl border border-slate-200 text-slate-500 dark:border-slate-700">
          <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg>
        </button>
        <div class="flex items-center gap-2 rounded-xl border border-slate-200 py-1.5 pl-1.5 pr-3 dark:border-slate-700">
          <div class="flex h-8 w-8 items-center justify-center rounded-lg bg-gradient-to-br from-brand-500 to-violet-500 text-xs font-bold text-white">
            {{ auth.user()?.name?.charAt(0) }}
          </div>
          <span class="hidden text-sm font-medium text-slate-700 sm:block dark:text-slate-300">{{ auth.user()?.name }}</span>
        </div>
      </div>
    </header>

    <main class="flex-1 p-6 lg:p-8">
      <router-outlet />
    </main>
  </div>
</div>
