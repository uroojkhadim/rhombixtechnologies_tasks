<div class="border-b border-wp-border bg-white py-8 dark:border-slate-700 dark:bg-surface-900">
  <div class="container-app">
    <nav class="breadcrumb">
      <a routerLink="/">Home</a>
      <span>/</span>
      <span class="text-wp-text dark:text-slate-200">Search</span>
    </nav>
    <h1 class="mt-4 font-serif text-3xl font-bold text-wp-text dark:text-white">Search results</h1>
  </div>
</div>

<div class="container-app py-10">
  <form (ngSubmit)="search()" class="wp-widget mb-8 flex flex-col gap-3 sm:flex-row">
    <input type="search" [(ngModel)]="query" name="q" placeholder="Search posts…" class="input-field flex-1" />
    <button type="submit" class="btn btn-primary">Search</button>
  </form>

  @if (loading()) {
    <p class="entry-meta text-center py-12">Searching…</p>
  } @else if (searched()) {
    @if (results().length) {
      <p class="entry-meta mb-6">{{ results().length }} results for “{{ query }}”</p>
      <div class="grid gap-6 sm:grid-cols-2 lg:grid-cols-3">
        @for (blog of results(); track blog._id) {
          <app-blog-card [blog]="blog" />
        }
      </div>
    } @else {
      <app-empty-state icon="🔍" title="Nothing found" message="Try different keywords.">
        <a routerLink="/blogs" class="btn btn-primary">Browse all posts</a>
      </app-empty-state>
    }
  }
</div>
