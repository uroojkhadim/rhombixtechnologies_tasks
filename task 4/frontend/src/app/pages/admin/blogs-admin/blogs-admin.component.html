<div class="space-y-6">
  <div class="flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
    <div>
      <h2 class="font-display text-xl font-bold text-slate-900 dark:text-white">Blog posts</h2>
      <p class="text-sm text-slate-500">Create, edit, and manage published content</p>
    </div>
    <a routerLink="/admin/blogs/new" class="btn btn-primary">+ New article</a>
  </div>

  <div class="card overflow-hidden">
    <div class="flex flex-col gap-3 border-b border-slate-200 p-4 sm:flex-row sm:items-center dark:border-slate-800">
      <input type="search" [(ngModel)]="search" placeholder="Search posts..." class="input-field max-w-xs !py-2" />
    </div>
    <div class="overflow-x-auto">
      <table class="w-full text-left text-sm">
        <thead class="border-b border-slate-200 bg-slate-50/80 text-xs font-semibold uppercase tracking-wider text-slate-500 dark:border-slate-800 dark:bg-slate-800/50">
          <tr>
            <th class="px-5 py-3">Title</th>
            <th class="px-5 py-3">Status</th>
            <th class="px-5 py-3">Views</th>
            <th class="px-5 py-3">Date</th>
            <th class="px-5 py-3 text-right">Actions</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-slate-100 dark:divide-slate-800">
          @for (blog of filteredBlogs(); track blog._id) {
            <tr class="transition hover:bg-slate-50/80 dark:hover:bg-slate-800/30">
              <td class="px-5 py-4 font-medium text-slate-900 dark:text-white">{{ blog.title }}</td>
              <td class="px-5 py-4">
                <span class="badge" [class]="blog.status === 'published' ? 'badge-brand' : 'bg-slate-100 text-slate-600'">{{ blog.status || 'published' }}</span>
              </td>
              <td class="px-5 py-4 text-slate-500">{{ blog.views }}</td>
              <td class="px-5 py-4 text-slate-500">{{ blog.createdAt | date: 'MMM d, yyyy' }}</td>
              <td class="px-5 py-4 text-right">
                <a [routerLink]="['/admin/blogs/edit', blog._id]" class="mr-3 text-sm font-medium text-brand-600 dark:text-brand-400">Edit</a>
                <button type="button" (click)="delete(blog._id)" class="text-sm font-medium text-red-600 dark:text-red-400">Delete</button>
              </td>
            </tr>
          } @empty {
            <tr><td colspan="5" class="px-5 py-12 text-center text-slate-500">No blogs yet.</td></tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>
