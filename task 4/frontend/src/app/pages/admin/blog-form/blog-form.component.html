<div class="mx-auto max-w-4xl space-y-6">
  <div>
    <h2 class="font-display text-xl font-bold text-slate-900 dark:text-white">{{ editId() ? 'Edit article' : 'Create article' }}</h2>
    <p class="text-sm text-slate-500">Write and publish your story</p>
  </div>

  <form [formGroup]="form" (ngSubmit)="submit()" class="card space-y-5 p-6 lg:p-8">
    <div class="grid gap-5 sm:grid-cols-2">
      <div class="sm:col-span-2">
        <label class="mb-1.5 block text-sm font-medium text-slate-700 dark:text-slate-300">Title</label>
        <input type="text" formControlName="title" class="input-field" placeholder="An engaging headline..." />
      </div>
      <div class="sm:col-span-2">
        <label class="mb-1.5 block text-sm font-medium text-slate-700 dark:text-slate-300">Excerpt</label>
        <textarea formControlName="excerpt" rows="2" class="input-field resize-none" placeholder="Brief summary for cards and SEO"></textarea>
      </div>
      <div>
        <label class="mb-1.5 block text-sm font-medium text-slate-700 dark:text-slate-300">Category</label>
        <select formControlName="category" class="input-field">
          <option value="">Select category</option>
          @for (c of categories(); track c._id) {
            <option [value]="c._id">{{ c.name }}</option>
          }
        </select>
      </div>
      <div>
        <label class="mb-1.5 block text-sm font-medium text-slate-700 dark:text-slate-300">Status</label>
        <select formControlName="status" class="input-field">
          <option value="published">Published</option>
          <option value="draft">Draft</option>
        </select>
      </div>
      <div class="sm:col-span-2">
        <label class="mb-1.5 block text-sm font-medium text-slate-700 dark:text-slate-300">Cover image</label>
        <input type="file" accept="image/*" (change)="onImage($event)" class="input-field !py-2 file:mr-4 file:rounded-lg file:border-0 file:bg-brand-50 file:px-4 file:py-2 file:text-sm file:font-semibold file:text-brand-700" />
      </div>
    </div>

    <div>
      <label class="mb-2 block text-sm font-medium text-slate-700 dark:text-slate-300">Tags</label>
      <div class="flex flex-wrap gap-2">
        @for (t of tags(); track t._id) {
          <button type="button" (click)="toggleTag(t._id)" class="rounded-full px-3 py-1.5 text-xs font-semibold transition" [class]="selectedTags().includes(t._id) ? 'bg-brand-600 text-white' : 'border border-slate-200 text-slate-600 dark:border-slate-700'">{{ t.name }}</button>
        }
      </div>
    </div>

    <label class="flex items-center gap-2 text-sm font-medium text-slate-700 dark:text-slate-300">
      <input type="checkbox" formControlName="isFeatured" class="rounded border-slate-300 text-brand-600 focus:ring-brand-500" />
      Feature on homepage
    </label>

    <div>
      <label class="mb-2 block text-sm font-medium text-slate-700 dark:text-slate-300">Content</label>
      <quill-editor formControlName="content" [modules]="quillModules" theme="snow" class="block overflow-hidden rounded-xl border border-slate-200 dark:border-slate-700" />
    </div>

    <div class="flex flex-wrap gap-3 border-t border-slate-200 pt-6 dark:border-slate-800">
      <button type="submit" class="btn btn-primary" [disabled]="loading()">{{ loading() ? 'Saving...' : 'Publish article' }}</button>
      <a routerLink="/admin/blogs" class="btn btn-secondary">Cancel</a>
    </div>
  </form>
</div>
